{% extends "base.html" %}
{% block page_id %}guc-0017{% endblock %}
{% block title %}Edit user{% endblock %}
{% block content %}
  <a class="back" href="{{ url_for('admin_users_page') }}">‹ User administration</a>
  <h1 style="margin:16px 0 4px;">Edit user</h1>
  <p class="secondary" style="margin:0 0 18px;"><span class="mono">{{ u.email }}</span></p>

  <form method="post" action="{{ url_for('admin_update_user', user_id=u.id) }}" style="max-width:520px;">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <div class="field"><label class="q" for="first_name">First name</label>
      <input id="first_name" name="first_name" type="text" value="{{ u.first_name or '' }}"></div>
    <div class="field"><label class="q" for="last_name">Last name</label>
      <input id="last_name" name="last_name" type="text" value="{{ u.last_name or '' }}"></div>
    <div class="field"><label class="q" for="email_ro">Email address</label>
      <input id="email_ro" type="text" value="{{ u.email }}" readonly style="background:#f3f2f1;"></div>
    <div class="field"><label class="q" for="role">Role</label>
      <select id="role" name="role" style="font-size:16px;padding:6px;border:2px solid var(--black);">
        {% for r in account_roles %}<option value="{{ r }}" {{ 'selected' if r == u.role }}>{{ r }}</option>{% endfor %}
      </select></div>
    <div class="field"><label class="q" for="account_status">Status</label>
      <select id="account_status" name="account_status" style="font-size:16px;padding:6px;border:2px solid var(--black);">
        {% for s in account_statuses %}<option value="{{ s }}" {{ 'selected' if s == u.account_status }}>{{ s }}</option>{% endfor %}
      </select></div>
    <button class="btn" type="submit">Save changes</button>
  </form>
{% endblock %}
