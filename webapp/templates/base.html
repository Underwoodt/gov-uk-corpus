<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shortlist Builder{% endblock %} — Content Shortlist Builder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4 1h5l3 3v11H4z' fill='%231d70b8'/><path d='M9 1v3h3z' fill='%23003078'/><g fill='none' stroke='%23fff' stroke-width='1' stroke-linecap='round'><path d='M6 7h5'/><path d='M6 9h5'/><path d='M6 11h4'/></g></svg>">
  <link rel="stylesheet" href="{{ url_for('static', path='govuk.css') }}">
</head>
<body>
  <div class="masthead"><div class="wrap"><span class="brand">Content Shortlist Builder</span></div></div>

  <div class="navbar"><div class="wrap inner">
    <span class="service">Content Relevance Filters</span>
    <a href="{{ url_for('list_categories_page') }}" class="{{ 'active' if active_nav != 'assistant' }}">Categories</a>
    <a href="{{ url_for('assistant_page') }}" class="{{ 'active' if active_nav == 'assistant' }}">AI Assistant</a>
  </div></div>

  <div class="wrap body">
    <div class="phase">
      <span class="tag">Alpha</span>
      <span class="meta">{{ corpus_meta }}</span>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
