{% extends "base.html" %}
{% block page_id %}guc-0034{% endblock %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<style>
  .help-article { max-width: 720px; }
  .help-article h1 { margin: 0 0 14px; }
  .help-article h2 { margin: 30px 0 8px; }
  .help-article h3 { margin: 20px 0 6px; }
  .help-article p, .help-article li { line-height: 1.55; }
  .help-article ul, .help-article ol { margin: 8px 0 8px 22px; }
  .help-article li { margin: 4px 0; }
  .help-article hr { border: 0; border-top: 1px solid var(--grey-border,#b1b4b6); margin: 26px 0; }
  .help-article code { background: var(--surface-2,#f3f2f1); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
  /* Kept explanatory callouts (e.g. the interface-level note) */
  .help-article blockquote.help-note {
    margin: 14px 0; padding: 12px 16px; border-left: 4px solid var(--blue,#1d70b8);
    background: var(--panel-blue,#eef4fb); border-radius: 0 6px 6px 0; }
  /* Screenshot placeholders — shown when the image file isn't in the repo yet */
  .help-article .help-figure {
    margin: 12px 0; padding: 10px 14px; border: 1px dashed var(--grey-border,#b1b4b6);
    border-radius: 6px; color: var(--grey-text,#505a5f); font-size: 14px; background: var(--surface-2,#f8f8f8); }
  /* Tables (e.g. the exportable-fields reference) */
  .help-article table.help-table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  .help-article table.help-table th, .help-article table.help-table td {
    border: 1px solid var(--grey-border,#b1b4b6); padding: 6px 10px; text-align: left; vertical-align: top; }
  .help-article table.help-table th { background: var(--surface-2,#f3f2f1); }
  /* Rolldowns */
  .help-article details { margin: 14px 0; border: 1px solid var(--grey-border,#b1b4b6); border-radius: 8px; padding: 0 14px; }
  .help-article details[open] { padding-bottom: 10px; }
  .help-article details > summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
  /* Real screenshots (served from docs/journeys/screenshots/) */
  .help-article figure.help-shot { margin: 16px 0; }
  .help-article figure.help-shot img {
    display: block; max-width: 100%; height: auto; border: 1px solid var(--grey-border,#b1b4b6);
    border-radius: 6px; }
  .help-article figure.help-shot figcaption {
    margin-top: 6px; font-size: 13px; color: var(--grey-text,#505a5f); }
</style>

<p style="margin:0 0 12px;"><a href="{{ url_for('help_index') }}">‹ All help &amp; guides</a></p>

<article class="help-article">
  <h1>{{ title }}</h1>
  {{ body | safe }}
</article>
{% endblock %}
