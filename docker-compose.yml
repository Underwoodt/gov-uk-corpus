# Shortlist builder, SQLite. Schema is created on startup (empty corpus until you seed).
#
#   docker compose up --build
#   open http://localhost:8600   (password: DASHBOARD_PASSWORD, default devpass)
#
# Seed a tiny live DEFRA slice (hits gov.uk, rate-limited):
#   docker compose run --rm app python -m govuk_corpus.pilot --db /data/pilot.db
#
# Or bind-mount a host DB instead of the named volume:
#   volumes: ["./data:/data"]
#
# Postgres: add a postgres service and set DB_HOST=postgres (that flag selects
# the PG backend). Don't set DB_HOST here or SQLite is skipped.

services:
  app:
    build: .
    ports:
      - "8600:8600"
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-devpass}
      CORPUS_DB: /data/pilot.db
    volumes:
      - corpus-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8600/login')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  corpus-data:
